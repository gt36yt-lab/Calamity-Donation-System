name: CI

on:
  push:
    branches:
      - main
      - integrate-ci
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6

      - name: Install Dependencies
        run: npm install

      - name: Linting
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Cargo Test
        run: cargo test

      - name: Build
        run: npm run build

      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            