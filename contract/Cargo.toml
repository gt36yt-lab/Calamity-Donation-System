[package]
name = "calamity-donation"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]   # lib enables tests + fuzzing; cdylib produces the .wasm

[dependencies]
soroban-sdk = { version = "27.0.2" }

[dev-dependencies]
soroban-sdk = { version = "27.0.2", features = ["testutils"] }
